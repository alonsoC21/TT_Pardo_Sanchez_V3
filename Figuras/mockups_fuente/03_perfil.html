<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mockup 3 · Asignación de perfil</title>
<link rel="stylesheet" href="base.css">
<style>
  h1.title { font-size: 32px; margin-top: 14px; }
  p.lead { margin-top: 10px; font-size: 14.5px; }
  .linked {
    margin-top: 16px; height: 62px; padding: 0 16px;
    display: flex; align-items: center; gap: 12px;
    background: var(--green-soft); border-radius: 18px;
  }
  .linked .tick {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.8px solid var(--green); display: flex; align-items: center; justify-content: center;
  }
  .linked .name { font-size: 14.5px; font-weight: 650; color: #1F4A3B; }
  .linked .state { font-size: 12.5px; color: #4E7A6A; }
  .label { margin: 16px 0 7px; font-size: 12.5px; font-weight: 600; color: #57534D; letter-spacing: 0.01em; }
  .field {
    height: 54px; border-radius: 18px; background: #FFFFFF; border: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px;
  }
  .field .caret { margin-left: auto; width: 2px; height: 20px; background: var(--green); border-radius: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    position: relative;
    height: 78px; border-radius: 18px; border: 1.5px solid var(--line); background: #FFFFFF;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 12.5px; color: #57534D;
  }
  .opt.on { border-color: var(--green); background: #F0F7F3; color: var(--green); font-weight: 650; }
  .opt .badge {
    position: absolute; top: 9px; right: 9px;
    width: 17px; height: 17px; border-radius: 50%; background: var(--green);
    display: flex; align-items: center; justify-content: center;
  }
  .spacer { flex: 1 1 auto; }
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span>18:42</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.2" width="2.8" height="3.8" rx="0.9"/><rect x="4.7" y="4.8" width="2.8" height="6.2" rx="0.9"/><rect x="9.4" y="2.4" width="2.8" height="8.6" rx="0.9"/><rect x="14.1" y="0" width="2.8" height="11" rx="0.9"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 3.6a10 10 0 0 1 14 0"/><path d="M3.6 6.3a6.4 6.4 0 0 1 8.8 0"/><path d="M6.2 9a2.8 2.8 0 0 1 3.6 0"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.7" y="0.7" width="19.6" height="10.6" rx="3" stroke="currentColor" stroke-width="1.3" opacity="0.5"/><rect x="2.4" y="2.4" width="13.5" height="7.2" rx="1.6" fill="currentColor"/><path d="M22 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" opacity="0.5"/></svg>
    </span>
  </div>

  <div class="topbar">
    <div class="back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    </div>
    <div class="step">Configuración · 3 de 3</div>
  </div>

  <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i></div>

  <div class="body">
    <h1 class="title">Un nombre,<br>un vínculo.</h1>
    <p class="lead">Personaliza este espacio para reconocer a quién acompañas.</p>

    <div class="linked">
      <div class="tick">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <div>
        <div class="name">ElderGuard · EG-014</div>
        <div class="state">Vinculado</div>
      </div>
    </div>

    <div class="label">Nombre de la persona</div>
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A857E" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.2" r="3.4"/><path d="M5.2 19.5a7 7 0 0 1 13.6 0"/></svg>
      <span>Abuelo José</span>
      <span class="caret"></span>
    </div>

    <div class="label">Elige un icono que lo represente</div>
    <div class="grid">
      <div class="opt on">
        <span class="badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 19.6a7.2 7.2 0 0 1 14 0"/><path d="M8.4 6.2 10 3.4"/><path d="m15.6 6.2-1.6-2.8"/></svg>
        Abuelo
      </div>
      <div class="opt">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 19.6a7.2 7.2 0 0 1 14 0"/><path d="M8.8 6.4c1.2-1.8 3-2.7 4.6-2.7"/><path d="M15.6 6.2 14 3.6"/></svg>
        Abuela
      </div>
      <div class="opt">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 10.6 12 4l8 6.6"/><path d="M6.2 9.6V20h11.6V9.6"/><path d="M10 20v-4.6h4V20"/></svg>
        Hogar
      </div>
      <div class="opt">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><path d="M9 14.2a4 4 0 0 0 6 0"/><path d="M9.2 9.6h.01"/><path d="M14.8 9.6h.01"/></svg>
        Persona
      </div>
    </div>

    <p class="note" style="margin-top:12px">Puedes cambiarlo cuando quieras.</p>

    <div class="spacer"></div>
    <div class="btn dark" style="margin-bottom:18px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12.5 6 6 6-6 6"/></svg>
      Empezar a cuidar
    </div>
  </div>
</div>
</body>
</html>
